name: Release desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布标签；留空时使用 v<tauri.conf.json version>"
        required: false
        type: string
      prerelease:
        description: "标记为预发布版本"
        required: true
        type: boolean
        default: false
      publish:
        description: "构建成功后立即公开；关闭时保留为草稿"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || inputs.release_tag || 'configured-version' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate version and prepare release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_draft: ${{ steps.release.outputs.release_draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify versions and create draft release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tauriConfig = JSON.parse(
              fs.readFileSync("src-tauri/tauri.conf.json", "utf8"),
            );
            const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            const packageSection = cargoToml
              .split(/^\[package\]\s*$/m)[1]
              ?.split(/^\[/m)[0];
            const cargoVersion = packageSection?.match(
              /^version\s*=\s*"([^"]+)"\s*$/m,
            )?.[1];

            const versions = {
              "package.json": packageJson.version,
              "src-tauri/Cargo.toml": cargoVersion,
              "src-tauri/tauri.conf.json": tauriConfig.version,
            };
            for (const [file, version] of Object.entries(versions)) {
              if (!version) {
                core.setFailed(`Unable to read the application version from ${file}`);
                return;
              }
            }

            const uniqueVersions = new Set(Object.values(versions));
            if (uniqueVersions.size !== 1) {
              core.setFailed(
                `Version mismatch: ${Object.entries(versions)
                  .map(([file, version]) => `${file}=${version}`)
                  .join(", ")}`,
              );
              return;
            }

            const version = tauriConfig.version;
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
            if (!semver.test(version)) {
              core.setFailed(`Application version is not valid SemVer: ${version}`);
              return;
            }

            const expectedTag = `v${version}`;
            const pushedTag = context.eventName === "push"
              ? context.ref.replace(/^refs\/tags\//, "")
              : "";
            const requestedTag = (process.env.REQUESTED_TAG || "").trim();
            const tag = pushedTag || requestedTag || expectedTag;
            if (tag !== expectedTag) {
              core.setFailed(
                `Release tag ${tag} does not match application version ${version}; expected ${expectedTag}`,
              );
              return;
            }

            const versionIsPrerelease = version.split("+")[0].includes("-");
            const prerelease =
              versionIsPrerelease || process.env.REQUESTED_PRERELEASE === "true";
            const publish =
              context.eventName === "push" || process.env.REQUESTED_PUBLISH === "true";
            const { owner, repo } = context.repo;
            const releaseBody = [
              "Windows、Linux 和 macOS 安装包由 GitHub Actions 在对应的原生 runner 上构建。",
              "",
              "下载后请使用 `SHA256SUMS.txt` 校验文件。未配置平台签名凭据时，Windows/Linux 产物未签名，macOS 产物仅使用 ad-hoc 签名，不等同于 Developer ID 签名和公证。",
              "",
              "各平台安装包已内置并优先使用 ADB 37.0.0、scrcpy/Server 4.1、最小 LGPL FFmpeg 9.0.1、AAPT2 9.4.0-15978811、Detect It Easy CLI/特征库 3.21、回环加固的 go-ios 1.3.2-mobius.1 和受限 Mobius SSH/SFTP 0.2.0；无需配置 PATH。精确来源、许可证和逐文件哈希随包提供，对应源码与构建脚本见同一 Release 的 third-party-sources 归档。",
              "",
              "Detect It Easy 所需的 Qt/ICU 运行库按目标随包分发；Linux 版还内置并校验 zlib、PCRE/PCRE2、double-conversion 和 GLib 的完整非 glibc ELF 依赖闭包。Apple Silicon 版扫描引擎的上游二进制需要 macOS 13 或更高版本；macOS 12 上主程序仍可启动，但 APK 加固结果会诚实显示为“无法确定”。",
              "",
              "Frida Server 仍由用户按设备 ABI/版本上传。桌面 SSH/SFTP 客户端已随包；Windows iOS USB 需要 Apple Mobile Device 驱动，Linux iOS USB 需要 usbmuxd 与 udev 权限，这些系统/设备条件不能由应用资源替代。",
              "",
              "越狱 iOS SSH 的 `root/alpine` 只是隔离实验设备的便捷默认值；离开受控测试环境前应立即更换密码或改用独立密钥。",
            ].join("\n");

            let release;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              release = response.data;
              core.info(`Reusing release ${release.id} for ${tag}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              const releases = await github.paginate(
                github.rest.repos.listReleases,
                { owner, repo, per_page: 100 },
              );
              const matchingDrafts = releases
                .filter((candidate) => candidate.draft && candidate.tag_name === tag)
                .sort(
                  (left, right) =>
                    right.assets.length - left.assets.length || right.id - left.id,
                );
              if (matchingDrafts.length > 0) {
                release = matchingDrafts[0];
                core.info(`Reusing draft release ${release.id} for ${tag}`);
                if (matchingDrafts.length > 1) {
                  core.warning(
                    `Found ${matchingDrafts.length} draft releases for ${tag}; using ${release.id}`,
                  );
                }
              } else {
                const response = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  target_commitish: context.sha,
                  name: `Mobius Device Lab ${version}`,
                  body: releaseBody,
                  draft: true,
                  prerelease,
                  generate_release_notes: true,
                });
                release = response.data;
                core.info(`Created draft release ${release.id} for ${tag}`);
              }
            }

            let tagCommit = null;
            try {
              let tagObject = (
                await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })
              ).data.object;
              for (let depth = 0; tagObject.type === "tag" && depth < 8; depth += 1) {
                tagObject = (
                  await github.rest.git.getTag({ owner, repo, tag_sha: tagObject.sha })
                ).data.object;
              }
              if (tagObject.type !== "commit") {
                core.setFailed(`Release tag ${tag} does not resolve to a commit`);
                return;
              }
              tagCommit = tagObject.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (tagCommit && tagCommit !== context.sha) {
              core.setFailed(
                `Release tag ${tag} already points to ${tagCommit}; refusing to rebuild it from ${context.sha}`,
              );
              return;
            }

            if (!release.draft) {
              core.setFailed(
                `Release ${tag} is already published; bump the application version instead of replacing a public release`,
              );
              return;
            }
            const publishAfterBuild = publish;
            const refreshed = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Mobius Device Lab ${version}`,
              body: releaseBody,
              draft: true,
              prerelease,
            });
            release = refreshed.data;
            core.info(`Release ${release.id} now targets ${context.sha}`);

            core.setOutput("version", version);
            core.setOutput("tag", tag);
            core.setOutput("release_id", String(release.id));
            core.setOutput("release_draft", String(release.draft));
            core.setOutput("prerelease", String(prerelease));
            core.setOutput("publish", String(publishAfterBuild));
            await core.summary
              .addHeading("Release preparation")
              .addTable([
                [
                  { data: "Version", header: true },
                  { data: "Tag", header: true },
                  { data: "Release", header: true },
                  { data: "Final state", header: true },
                ],
                [
                  version,
                  tag,
                  String(release.id),
                  publishAfterBuild ? "published" : "draft",
                ],
              ])
              .write();

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-2022
            rust_target: x86_64-pc-windows-msvc
            resource_target: windows-x86_64
            bundles: nsis
          - label: Linux x64
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            resource_target: linux-x86_64
            bundles: appimage,deb
          - label: macOS Apple Silicon
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            resource_target: macos-aarch64
            bundles: dmg
          - label: macOS Intel
            platform: macos-15-intel
            rust_target: x86_64-apple-darwin
            resource_target: macos-x86_64
            bundles: dmg
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            nasm \
            xdg-utils

      - name: Install Intel macOS assembly tools
        if: runner.os == 'macOS' && matrix.resource_target == 'macos-x86_64'
        shell: bash
        run: command -v nasm >/dev/null 2>&1 || brew install nasm

      - name: Set up Windows native build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            git
            make
            python
            tar
            xz
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Go for bundled Go tools
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend types
        run: pnpm run check

      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CONFIGURED_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CONFIGURED_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CONFIGURED_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CONFIGURED_APPLE_ID: ${{ secrets.APPLE_ID }}
          CONFIGURED_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          CONFIGURED_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # Keep the app and every locally built bundled tool compatible with
          # the same declared floor. Without this, the active runner SDK can
          # silently raise FFmpeg's minimum macOS version.
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"

          write_environment_value() {
            local variable_name="$1"
            local variable_value="$2"
            local delimiter="MOBIUS_${variable_name}_${RANDOM}_${RANDOM}"
            {
              echo "${variable_name}<<${delimiter}"
              printf '%s\n' "$variable_value"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          }

          if [[ -n "$CONFIGURED_CERTIFICATE" || -n "$CONFIGURED_CERTIFICATE_PASSWORD" || -n "$CONFIGURED_IDENTITY" ]]; then
            if [[ -z "$CONFIGURED_CERTIFICATE" || -z "$CONFIGURED_CERTIFICATE_PASSWORD" || -z "$CONFIGURED_IDENTITY" ]]; then
              echo "APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, and APPLE_SIGNING_IDENTITY must be configured together." >&2
              exit 1
            fi
            write_environment_value APPLE_CERTIFICATE "$CONFIGURED_CERTIFICATE"
            write_environment_value APPLE_CERTIFICATE_PASSWORD "$CONFIGURED_CERTIFICATE_PASSWORD"
            write_environment_value APPLE_SIGNING_IDENTITY "$CONFIGURED_IDENTITY"
          else
            write_environment_value APPLE_SIGNING_IDENTITY "-"
          fi

          if [[ -n "$CONFIGURED_APPLE_ID" || -n "$CONFIGURED_APPLE_PASSWORD" || -n "$CONFIGURED_APPLE_TEAM_ID" ]]; then
            if [[ -z "$CONFIGURED_CERTIFICATE" || -z "$CONFIGURED_APPLE_ID" || -z "$CONFIGURED_APPLE_PASSWORD" || -z "$CONFIGURED_APPLE_TEAM_ID" ]]; then
              echo "APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID require a complete signing certificate configuration and must be configured together." >&2
              exit 1
            fi
            write_environment_value APPLE_ID "$CONFIGURED_APPLE_ID"
            write_environment_value APPLE_PASSWORD "$CONFIGURED_APPLE_PASSWORD"
            write_environment_value APPLE_TEAM_ID "$CONFIGURED_APPLE_TEAM_ID"
          fi

      - name: Prepare bundled toolchain on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >-
          python scripts/prepare_tool_bundle.py
          --lock packaging/toolchain.lock.json
          --target ${{ matrix.resource_target }}
          --output src-tauri/resources/tools/${{ matrix.resource_target }}

      - name: Prepare bundled toolchain on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          python3 scripts/prepare_tool_bundle.py
          --lock packaging/toolchain.lock.json
          --target ${{ matrix.resource_target }}
          --output src-tauri/resources/tools/${{ matrix.resource_target }}

      - name: Verify bundled toolchain on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >-
          python scripts/verify_tool_bundle.py
          --lock packaging/toolchain.lock.json
          --target ${{ matrix.resource_target }}
          --root src-tauri/resources/tools

      - name: Verify bundled toolchain on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          python3 scripts/verify_tool_bundle.py
          --lock packaging/toolchain.lock.json
          --target ${{ matrix.resource_target }}
          --root src-tauri/resources/tools

      - name: Sign bundled macOS executables
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/resources/tools/${{ matrix.resource_target }}"
          signing_identity="${APPLE_SIGNING_IDENTITY:--}"
          while IFS= read -r -d '' candidate; do
            if ! file "$candidate" | grep -q 'Mach-O'; then
              continue
            fi
            if [[ "$(basename "$candidate")" == "adb" ]] && codesign --verify --strict "$candidate"; then
              echo "Preserving upstream Google signature: $candidate"
              continue
            fi
            if [[ "$signing_identity" == "-" ]]; then
              codesign --force --sign - --timestamp=none "$candidate"
            else
              codesign --force --options runtime --timestamp --sign "$signing_identity" "$candidate"
            fi
          done < <(find "$bundle_dir" -type f -print0)

          python3 scripts/refresh_tool_manifest.py --bundle "$bundle_dir"
          python3 scripts/verify_tool_bundle.py \
            --lock packaging/toolchain.lock.json \
            --target "${{ matrix.resource_target }}" \
            --root src-tauri/resources/tools

      - name: Build and upload native package
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: ${{ runner.os == 'Linux' && '1' || '' }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: ${{ needs.prepare.outputs.release_draft }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: ${{ runner.os != 'Linux' }}
          workflowArtifactNamePattern: "mobius-[platform]-[arch]-[bundle]"
          releaseAssetNamePattern: "Mobius-Device-Lab_[version]_[platform]_[arch][setup][ext]"
          retryAttempts: 2
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      - name: Finalize and replace AppImage after linuxdeploy normalization
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          target_root="src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage"
          appdirs=("$target_root"/*.AppDir)
          appimages=("$target_root"/*.AppImage)
          if [[ "${#appdirs[@]}" -ne 1 || "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected one AppDir and one AppImage." >&2
            exit 1
          fi

          mapfile -t manifests < <(
            find "${appdirs[0]}" -type f \
              -path "*/resources/tools/linux-x86_64/manifest.json" -print
          )
          if [[ "${#manifests[@]}" -ne 1 ]]; then
            echo "Expected one AppImage tool manifest." >&2
            exit 1
          fi
          bundle_dir="$(dirname "${manifests[0]}")"
          tools_root="$(dirname "$bundle_dir")"
          python3 scripts/refresh_tool_manifest.py --bundle "$bundle_dir"
          python3 scripts/verify_tool_bundle.py \
            --lock packaging/toolchain.lock.json \
            --target "${{ matrix.resource_target }}" \
            --root "$tools_root"

          cache_root="${XDG_CACHE_HOME:-$HOME/.cache}"
          plugin="$cache_root/tauri/linuxdeploy-plugin-appimage.AppImage"
          if [[ ! -x "$plugin" ]]; then
            echo "Tauri's downloaded AppImage output plugin was not found." >&2
            exit 1
          fi
          rebuilt="$RUNNER_TEMP/mobius-repacked.AppImage"
          env \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            ARCH=x86_64 \
            LDAI_OUTPUT="$rebuilt" \
            VERSION="$RELEASE_VERSION" \
            "$plugin" --appimage-extract-and-run --appdir "${appdirs[0]}"
          if [[ ! -s "$rebuilt" ]]; then
            echo "Repacked AppImage was not created." >&2
            exit 1
          fi
          install -m 0755 "$rebuilt" "${appimages[0]}"

          release_asset="$RUNNER_TEMP/Mobius-Device-Lab_${RELEASE_VERSION}_linux_amd64.AppImage"
          cp "${appimages[0]}" "$release_asset"
          gh release upload "$RELEASE_TAG" "$release_asset" --clobber

      - name: Verify toolchain inside Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem -Path "src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP "mobius-nsis-audit"
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          & 7z x -y "-o$extractRoot" $installers[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to extract the NSIS installer"
          }
          $manifests = @(Get-ChildItem -Path $extractRoot -Filter "manifest.json" -File -Recurse | Where-Object {
            $_.Directory.Name -eq "${{ matrix.resource_target }}" -and
            $_.Directory.Parent.Name -eq "tools" -and
            $_.Directory.Parent.Parent.Name -eq "resources"
          })
          if ($manifests.Count -ne 1) {
            throw "Expected one packaged tool manifest, found $($manifests.Count)"
          }
          $toolsRoot = $manifests[0].Directory.Parent.FullName
          python scripts/verify_tool_bundle.py `
            --lock packaging/toolchain.lock.json `
            --target "${{ matrix.resource_target }}" `
            --root $toolsRoot

      - name: Verify toolchain inside Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          target_root="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          debs=("$target_root"/deb/*.deb)
          appimages=("$target_root"/appimage/*.AppImage)
          if [[ "${#debs[@]}" -ne 1 || "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected one DEB and one AppImage." >&2
            exit 1
          fi

          audit_root="$(mktemp -d)"
          trap 'rm -rf "$audit_root"' EXIT
          dpkg-deb -x "${debs[0]}" "$audit_root/deb"
          mkdir -p "$audit_root/appimage"
          appimage="$(realpath "${appimages[0]}")"
          chmod +x "$appimage"
          (cd "$audit_root/appimage" && "$appimage" --appimage-extract >/dev/null)

          for extracted in "$audit_root/deb" "$audit_root/appimage/squashfs-root"; do
            mapfile -t manifests < <(
              find "$extracted" -type f \
                -path "*/resources/tools/${{ matrix.resource_target }}/manifest.json" -print
            )
            if [[ "${#manifests[@]}" -ne 1 ]]; then
              echo "Expected one packaged tool manifest in $extracted." >&2
              exit 1
            fi
            tools_root="$(dirname "$(dirname "${manifests[0]}")")"
            python3 scripts/verify_tool_bundle.py \
              --lock packaging/toolchain.lock.json \
              --target "${{ matrix.resource_target }}" \
              --root "$tools_root"
          done

      - name: Verify toolchain inside macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg)
          if [[ "${#dmgs[@]}" -ne 1 ]]; then
            echo "Expected exactly one DMG, found ${#dmgs[@]}." >&2
            exit 1
          fi
          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" -quiet || true
            rmdir "$mount_point" || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "${dmgs[0]}" -quiet
          manifest_count="$(find "$mount_point" -type f \
            -path "*/resources/tools/${{ matrix.resource_target }}/manifest.json" \
            -print | wc -l | tr -d ' ')"
          manifest="$(find "$mount_point" -type f \
            -path "*/resources/tools/${{ matrix.resource_target }}/manifest.json" \
            -print -quit)"
          if [[ "$manifest_count" -ne 1 || -z "$manifest" ]]; then
            echo "Expected one packaged tool manifest in the DMG." >&2
            exit 1
          fi
          tools_root="$(dirname "$(dirname "$manifest")")"
          python3 scripts/verify_tool_bundle.py \
            --lock packaging/toolchain.lock.json \
            --target "${{ matrix.resource_target }}" \
            --root "$tools_root"

  sources:
    name: Build third-party source package
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create source and build-script archive
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python3 scripts/create_third_party_sources.py
          --lock packaging/toolchain.lock.json
          --output "Mobius-Device-Lab_${RELEASE_VERSION}_third-party-sources.tar.xz"

      - name: Upload source package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "Mobius-Device-Lab_${RELEASE_VERSION}_third-party-sources.tar.xz"
          --clobber

  finalize:
    name: Checksums and finalize release
    needs: [prepare, build, sources]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download and verify release packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          expected_assets=(
            "Mobius-Device-Lab_${RELEASE_VERSION}_darwin_aarch64.dmg"
            "Mobius-Device-Lab_${RELEASE_VERSION}_darwin_x64.dmg"
            "Mobius-Device-Lab_${RELEASE_VERSION}_linux_amd64.AppImage"
            "Mobius-Device-Lab_${RELEASE_VERSION}_linux_amd64.deb"
            "Mobius-Device-Lab_${RELEASE_VERSION}_windows_x64-setup.exe"
            "Mobius-Device-Lab_${RELEASE_VERSION}_third-party-sources.tar.xz"
          )

          declare -A expected_lookup=()
          declare -A downloaded_lookup=()
          for asset_name in "${expected_assets[@]}"; do
            expected_lookup["$asset_name"]=1
          done

          mapfile -t release_assets < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq '.[] | select(.name != "SHA256SUMS.txt") | @base64'
          )

          if [[ "${#release_assets[@]}" -ne "${#expected_assets[@]}" ]]; then
            echo "Expected ${#expected_assets[@]} native packages, found ${#release_assets[@]}." >&2
            exit 1
          fi

          mkdir -p release-artifacts
          for encoded_asset in "${release_assets[@]}"; do
            asset_json="$(printf '%s' "$encoded_asset" | base64 --decode)"
            asset_id="$(jq -r '.id' <<< "$asset_json")"
            asset_name="$(jq -r '.name' <<< "$asset_json")"
            asset_size="$(jq -r '.size' <<< "$asset_json")"
            asset_digest="$(jq -r '.digest // ""' <<< "$asset_json")"
            asset_state="$(jq -r '.state' <<< "$asset_json")"

            if [[ -z "${expected_lookup[$asset_name]+present}" ]]; then
              echo "Unexpected release asset: $asset_name" >&2
              exit 1
            fi
            if [[ -n "${downloaded_lookup[$asset_name]+present}" ]]; then
              echo "Duplicate release asset: $asset_name" >&2
              exit 1
            fi
            if [[ "$asset_state" != "uploaded" ]]; then
              echo "Release asset is not ready: $asset_name ($asset_state)" >&2
              exit 1
            fi
            if [[ ! "$asset_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Release asset has no valid GitHub SHA-256 digest: $asset_name" >&2
              exit 1
            fi

            destination="release-artifacts/$asset_name"
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "$destination"

            actual_size="$(stat -c '%s' "$destination")"
            actual_digest="$(sha256sum "$destination" | cut -d ' ' -f 1)"
            if [[ "$actual_size" != "$asset_size" ]]; then
              echo "Size mismatch for $asset_name: expected $asset_size, downloaded $actual_size" >&2
              exit 1
            fi
            if [[ "sha256:$actual_digest" != "$asset_digest" ]]; then
              echo "Digest mismatch for $asset_name." >&2
              exit 1
            fi
            downloaded_lookup["$asset_name"]=1
          done

          for asset_name in "${expected_assets[@]}"; do
            if [[ -z "${downloaded_lookup[$asset_name]+present}" ]]; then
              echo "Missing release asset: $asset_name" >&2
              exit 1
            fi
          done

          (
            cd release-artifacts
            sha256sum -- "${expected_assets[@]}" | LC_ALL=C sort -k2
          ) > SHA256SUMS.txt

      - name: Upload checksum manifest
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId)) {
              core.setFailed(`Invalid release id: ${process.env.RELEASE_ID}`);
              return;
            }

            const name = "SHA256SUMS.txt";
            const checksumPath = "SHA256SUMS.txt";
            const existingAssets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              { owner, repo, release_id: releaseId, per_page: 100 },
            );
            for (const asset of existingAssets.filter((item) => item.name === name)) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              });
            }

            const data = fs.readFileSync(checksumPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name,
              data,
              headers: {
                "content-type": "text/plain; charset=utf-8",
                "content-length": data.length,
              },
            });
            core.notice(`Uploaded ${name} to release ${releaseId}`);

      - name: Publish release when requested
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId)) {
              core.setFailed(`Invalid release id: ${process.env.RELEASE_ID}`);
              return;
            }
            const response = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
              prerelease: process.env.RELEASE_PRERELEASE === "true",
            });
            core.notice(`Release published: ${response.data.html_url}`);
